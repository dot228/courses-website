<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстрація на сайті</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        form {
            background-color: #fff;
            padding: 2em;
            width: 300px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 0.5em;
        }

        input {
            width: calc(100% - 1em);
            padding: 0.5em;
            margin-bottom: 1em;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding-right: 2.5em;
        }

        .password-container {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 0.5em;
            top: 1.5em;
            cursor: pointer;
        }

        button {
            background-color: #007BFF;
            color: #fff;
            padding: 0.5em 1em;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }

        button:hover {
            background-color: #0056b3;
        }

        .login-link {
            text-align: center;
            margin-top: 1em;
        }

        .login-link a {
            color: #007BFF;
            text-decoration: none;
        }
    </style>
</head>
<body>

<form action="general.php" method="post">
    <label for="name">Ім'я:</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Електронна пошта:</label>
    <input type="email" id="email" name="email" required>

    <label for="password" class="password-container">Пароль:</label>
    <input type="password" id="password" name="password" required>
    <span class="toggle-password" onclick="togglePassword('password')">👁️ Підглянути</span>

    <button type="submit">Зареєструватися</button>

    <div class="login-link">
        <p>Вже є акаунт? <a href="views/user/login.php">Увійти</a></p>
    </div>
</form>

<script>
    function togglePassword(fieldId) {
        const passwordField = document.getElementById(fieldId);
        const toggleButton = document.querySelector('.toggle-password');

        if (passwordField.type === 'password') {
            passwordField.type = 'text';
            toggleButton.textContent = '🙈 Сховати';
        } else {
            passwordField.type = 'password';
            toggleButton.textContent = '👁️ Підглянути';
        }
    }
</script>

</body>
</html>
